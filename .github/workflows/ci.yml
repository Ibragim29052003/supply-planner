name: Build and test
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", ".vscode/**"]
  pull_request:
    paths-ignore: ["**/*.md", ".vscode/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SupplyPlanner.slnx --locked-mode
      - run: dotnet test SupplyPlanner.slnx -c Release --no-restore -m:1 -p:UseSharedCompilation=false --logger "trx;LogFilePrefix=tests"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          retention-days: 7
